name: example_spec
description: An example spec that extracts a list of cities with name, country, and population.
version: 1
fields:
  page_title:
    selector: "//h1/text()"
    type: text
    required: true
    processors:
      - strip
  cities:
    selector: "//div[@class='city']"
    type: text
    multiple: true
    fields:
      name:
        selector: ".//span[@class='city-name']//text()"
        type: text
        required: true
        processors:
          - strip
      url:
        selector: ".//a[@class='city-link']/@href"
        type: link
        required: true
      country:
        selector: ".//span[@class='city-country']//text()"
        type: text
        required: true
        processors:
          - strip
      population:
        selector: ".//span[@class='city-population']//text()"
        type: text
        required: true
        processors:
          - strip
          - regex: ["pop: (\\d+)"]
